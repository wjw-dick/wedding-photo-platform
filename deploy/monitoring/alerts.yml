groups:
  - name: wedding-platform
    rules:
      - alert: AppDown
        expr: up{job="wedding-app"} == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "应用不可用", description: "wedding-app 已连续 2 分钟无法抓取。" }

      - alert: HighErrorRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 0.001) > 0.02
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "5xx 比例超过 2%" }

      - alert: SlowApi
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le)) > 2
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "P95 响应超过 2 秒" }

      - alert: DbPoolSaturated
        expr: hikaricp_connections_active / hikaricp_connections_max > 0.85
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "数据库连接池使用率超过 85%" }

      - alert: RabbitQueueBacklog
        expr: rabbitmq_queue_messages_ready{queue=~"msg.notify|report.async|mp.event"} > 1000
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "消息队列积压" }

      - alert: DiskLow
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.15
        for: 10m
        labels: { severity: critical }
        annotations: { summary: "磁盘剩余空间低于 15%" }
